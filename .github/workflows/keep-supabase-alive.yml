name: Keep Supabase Alive

# 주 2회(월/목) Supabase에 가벼운 조회 요청을 보내 무료 플랜 자동 비활성화(7일 미사용)를 방지
on:
  schedule:
    - cron: '0 3 * * 1' # 매주 월요일 03:00 UTC (한국 시간 12:00)
    - cron: '0 3 * * 4' # 매주 목요일 03:00 UTC (한국 시간 12:00)
  workflow_dispatch: {} # 수동 실행 버튼도 사용 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/monthly_summary?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
